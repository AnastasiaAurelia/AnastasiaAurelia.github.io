<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Training-image resolution evidence comparison</title><desc id="desc">A 960 by 540 frame contains 518,400 pixels. A 1920 by 1080 frame contains 2,073,600 pixels, four times as many. More pixels do not guarantee better OCR.</desc>
  <rect width="1500" height="760" fill="#f7f4ed"/><style>.h{font:700 34px Arial;fill:#17151a}.k{font:700 20px Arial;fill:#9a3f23}.t{font:700 28px Arial;fill:#17151a}.s{font:400 18px Arial;fill:#625d66}.frame{fill:#fffdf8;stroke:#29252e;stroke-width:4}.pixel{fill:#ad4c2b;opacity:.7}</style>
  <text x="90" y="78" class="h">A training archive needs an acquisition contract.</text><text x="90" y="118" class="s">Source comparison: observed 540p-class material versus the documented 1080p training target</text>
  <g transform="translate(110 205)"><rect class="frame" width="480" height="270"/><g class="pixel"><rect x="30" y="30" width="12" height="12"/><rect x="48" y="30" width="12" height="12"/><rect x="66" y="30" width="12" height="12"/><rect x="30" y="48" width="12" height="12"/><rect x="48" y="48" width="12" height="12"/><rect x="66" y="48" width="12" height="12"/></g><text class="t" x="240" y="320" text-anchor="middle">960 × 540</text><text class="k" x="240" y="355" text-anchor="middle">518,400 pixels</text></g>
  <text x="720" y="355" class="t" text-anchor="middle">≈ 4×</text><text x="720" y="389" class="s" text-anchor="middle">pixel count</text>
  <g transform="translate(850 155)"><rect class="frame" width="540" height="304"/><g class="pixel"><rect x="30" y="30" width="12" height="12"/><rect x="48" y="30" width="12" height="12"/><rect x="66" y="30" width="12" height="12"/><rect x="84" y="30" width="12" height="12"/><rect x="30" y="48" width="12" height="12"/><rect x="48" y="48" width="12" height="12"/><rect x="66" y="48" width="12" height="12"/><rect x="84" y="48" width="12" height="12"/><rect x="30" y="66" width="12" height="12"/><rect x="48" y="66" width="12" height="12"/><rect x="66" y="66" width="12" height="12"/><rect x="84" y="66" width="12" height="12"/></g><text class="t" x="270" y="354" text-anchor="middle">1920 × 1080</text><text class="k" x="270" y="389" text-anchor="middle">2,073,600 pixels</text></g>
  <rect x="110" y="600" width="1280" height="82" rx="12" fill="#efe8dc"/><text class="t" x="750" y="635" text-anchor="middle">More pixels do not automatically create better OCR.</text><text class="s" x="750" y="664" text-anchor="middle">The engineering value is consistent spatial evidence for character shape, blur review, cropping and error analysis.</text>
</svg>
