<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Bias and variance model-selection concept</title><desc id="desc">Three conceptual panels show a model that is too simple with high bias, a balanced model selected using held-out validation evidence, and a model that is too flexible with high variance.</desc>
  <rect width="1500" height="760" fill="#f7f4ed"/><style>.h{font:700 34px Arial;fill:#17151a}.t{font:700 24px Arial;fill:#17151a}.k{font:700 18px Arial;fill:#9a3f23}.s{font:400 17px Arial;fill:#625d66}.panel{fill:#fffdf8;stroke:#c9c1b6;stroke-width:2}.dot{fill:#29252e}.fit{stroke:#ad4c2b;stroke-width:5;fill:none}</style>
  <text x="90" y="78" class="h">More images matter only when they improve generalization.</text><text x="90" y="116" class="s">Conceptual model-selection framing from Andrew Ng’s CS229 notes; not a production result</text>
  <g transform="translate(90 170)"><rect class="panel" width="400" height="430" rx="14"/><g class="dot"><circle cx="65" cy="320" r="8"/><circle cx="110" cy="290" r="8"/><circle cx="160" cy="235" r="8"/><circle cx="210" cy="180" r="8"/><circle cx="260" cy="122" r="8"/><circle cx="330" cy="78" r="8"/></g><path class="fit" d="M60 255L340 150"/><text class="t" x="200" y="374" text-anchor="middle">Too simple</text><text class="k" x="200" y="406" text-anchor="middle">HIGH BIAS</text></g>
  <g transform="translate(550 170)"><rect class="panel" width="400" height="430" rx="14"/><g class="dot"><circle cx="65" cy="320" r="8"/><circle cx="110" cy="290" r="8"/><circle cx="160" cy="235" r="8"/><circle cx="210" cy="180" r="8"/><circle cx="260" cy="122" r="8"/><circle cx="330" cy="78" r="8"/></g><path class="fit" d="M55 330C130 315 135 235 205 188S285 100 345 70"/><text class="t" x="200" y="374" text-anchor="middle">Balanced</text><text class="k" x="200" y="406" text-anchor="middle">VALIDATE ON UNSEEN DATA</text></g>
  <g transform="translate(1010 170)"><rect class="panel" width="400" height="430" rx="14"/><g class="dot"><circle cx="65" cy="320" r="8"/><circle cx="110" cy="290" r="8"/><circle cx="160" cy="235" r="8"/><circle cx="210" cy="180" r="8"/><circle cx="260" cy="122" r="8"/><circle cx="330" cy="78" r="8"/></g><path class="fit" d="M55 330C85 250 90 355 120 285S145 170 170 235 195 265 220 175 250 70 270 125 310 170 345 65"/><text class="t" x="200" y="374" text-anchor="middle">Too flexible</text><text class="k" x="200" y="406" text-anchor="middle">HIGH VARIANCE</text></g>
  <text x="750" y="675" class="s" text-anchor="middle">Training error alone cannot choose the model; use a held-out validation set or an appropriate cross-validation design.</text>
</svg>
