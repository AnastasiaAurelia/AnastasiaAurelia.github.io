<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Five-site LPR 30-day and 7-day Entry-Exit performance</title>
  <desc id="desc">Grouped bar chart. CFX 87.25 and 79.06; Matraman 93.10 and 97.02; JRP 97.32 and 95.72; Menteng Central 96.51 and 96.94; Gading Riverview 89.51 and 87.62 percent.</desc>
