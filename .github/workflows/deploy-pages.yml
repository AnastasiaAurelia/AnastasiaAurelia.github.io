name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # the repository's actual default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          # Public Sanity identifiers only — project ID and dataset name,
          # not secrets (see repo Settings → Variables). No write token
          # is ever read here or passed to the build.
          VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          test -f dist/404.html || { echo "::error::dist/404.html (SPA fallback) is missing"; exit 1; }
          echo "Build output verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
