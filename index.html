<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // GitHub Pages SPA fallback — restore half. dist/404.html (generated
      // by scripts/generate-spa-fallback.ts) redirects a deep-linked route
      // like /work/researchlens here as /?/work/researchlens; this runs
      // before React mounts and rewrites the URL back to the clean path
      // via history.replaceState, so React Router sees the real route on
      // first render.
      // Pattern: https://github.com/rafgraph/spa-github-pages (MIT)
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Anastasia Aurelia — AI Product Manager. Product work across computer vision, applied AI, and agentic systems."
    />
    <meta name="theme-color" content="#faf9f6" />
    <title>Anastasia Aurelia — AI Product Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
